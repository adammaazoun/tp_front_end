<div class="mt-4">
  <h3 class="font-semibold mb-3">
    Tâches
  </h3>

  @if (tasks().length === 0) {
  <p class="text-gray-500">
    Aucune tâche.
  </p>
  } @else {
  <div class="space-y-3">
    @for (task of tasks(); track task.id) {
    <div class="border-l-4 border-blue-500 bg-gray-50 p-3">
      <p class="font-medium">
        {{ task.title }}
      </p>

      <p class="text-sm">
        Priorité :
        {{ task.priority }}
      </p>

      <p class="text-sm">
        Statut :
        {{ task.status }}
      </p>
      @if (showAssignee()) {
      <span class="text-xs text-slate-500">👤 {{ assigneeName(task.assigneeId) }}</span>  }
    </div>
    }
  </div>
  }
</div>
