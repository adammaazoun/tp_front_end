<div class="bg-white shadow-md rounded-lg p-6">
    <h2 class="text-xl font-bold">
        {{ project().name }}
    </h2>

    <p class="text-gray-600 mt-2">
        {{ project().description }}
    </p>

    <p class="mt-3">
        Statut :
        <span class="font-semibold">
            {{ project().status }}
        </span>
    </p>

    <app-task-list [tasks]="project().tasks">
    </app-task-list>

    <button (click)="selectProject()" class="mt-4 px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">
        Sélectionner
    </button>
</div>
